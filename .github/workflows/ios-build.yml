name: Build iOS Cordova

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      # 1. Клонируем репозиторий
      - uses: actions/checkout@v3

      # 2. Устанавливаем Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # 3. Устанавливаем Cordova и зависимости
      - name: Install Cordova & dependencies
        run: |
          npm install -g cordova
          npm install

      # 4. Синхронизируем iOS проект через Capacitor
      - name: Sync Capacitor iOS
        run: npx cap sync ios

      # 5. Архивируем проект через xcodebuild
      - name: Build iOS Archive
        run: |
          cd ios/App
          mkdir -p build
          xcodebuild -workspace MyApp.xcworkspace \
            -scheme MyApp \
            -sdk iphoneos \
            -configuration Release \
            archive -archivePath build/MyApp.xcarchive

      # 6. Экспортируем .ipa
      - name: Export .ipa
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: |
          cd ios/App
          xcodebuild -exportArchive \
            -archivePath build/MyApp.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath build

      # 7. Загружаем артефакт .ipa
      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v3
        with:
          name: myapp-ipa
          path: ios/App/build/*.ipa
