name: Build iOS

on:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Install CocoaPods
        run: pod install --project-directory=ios/App

      - name: Build iOS .ipa
        run: |
          cd ios/App
          mkdir -p build
          # Схема и workspace будут автоматически найдены через 'xcodebuild -list'
          WORKSPACE=$(ls *.xcworkspace | head -n 1)
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" | grep -A1 "Schemes:" | tail -n1 | xargs)
          echo "Using workspace: $WORKSPACE"
          echo "Using scheme: $SCHEME"
          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            archive -archivePath build/App.xcarchive
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath build

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: myapp-ipa
          path: ios/App/build/*.ipa
